<!doctype html>
<meta charset="utf-8">
<title>Garage render</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100%;height:auto}</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// heading turns the nose toward +x. angle is the camera's orbit start, side is where the text space goes.
const CARS = {
  atlas: { sign: "ATLAS", neon: "#ff5a1f", paint: /CARROSSERIE/, color: "#e8590c", heading: 0, length: 4.9, angle: 0.72, lift: 0, shift: 0.19 },
  trustcheck: { sign: "TRUSTCHECK", neon: "#2fb4ff", paint: null, color: null, heading: 0, length: 4.7, angle: 0.72, lift: 0, shift: 0.19 },
  agrix: { sign: "AGRIX", neon: "#57e36f", paint: null, color: null, heading: 0, length: 4.4, angle: 0.72, lift: 0, shift: 0.2, boost: 1.6 },
  nss: { sign: "DJS NSS", neon: "#ffc43a", paint: null, color: null, heading: -Math.PI / 2, length: 5.0, angle: 0.72, lift: 0, shift: 0.19 },
  hero: { sign: "DHRUV'S GARAGE", neon: "#ff2d46", paint: /CARROSSERIE/, color: "#12151b", file: "atlas", heading: 0, length: 4.9, angle: 0.5, lift: 0, shift: 0 },
};
// Close-up shots: the same cars with a fixed camera position, look target and lens.
const common = { lift: 0, angle: 0.72, sign: "" };
Object.assign(CARS, {
  workshop: { ...common, file: "atlas", neon: "#ff5a1f", paint: /CARROSSERIE/, color: "#e8590c", heading: 0, length: 4.9, shift: 0.24, shot: { pos: [3.15, 0.34, 2.95], look: [0.72, 0.42, 1.62], fov: 24 } },
  glovebox: { ...common, file: "trustcheck", neon: "#2fb4ff", paint: null, color: null, heading: 0, length: 4.7, shift: 0.22, boost: 0.75, shot: { pos: [3.6, 1.28, 1.5], look: [0.1, 0.8, 0.1], fov: 22 } },
  service: { ...common, file: "nss", neon: "#ffc43a", paint: null, color: null, heading: -Math.PI / 2, length: 5.0, shift: 0.15, dim: true, shot: { pos: [3.0, 0.5, -6.0], look: [0.2, 0.68, -1.5], fov: 24 } },
  hardware: { ...common, file: "agrix", neon: "#57e36f", paint: null, color: null, heading: 0, length: 4.4, shift: 0.24, boost: 1.6, shot: { pos: [4.1, 0.75, -2.4], look: [0.9, 1.0, -0.75], fov: 28 } },
  tools: { ...common, sign: "THE TOOL WALL", signAt: [0, 3.32, -0.68], signScale: 0.62, scene: "tools", neon: "#ff2d46", paint: null, color: null, heading: 0, length: 4.6, shift: 0, shot: { pos: [1.5, 1.72, 7.6], look: [0, 1.72, 0], fov: 30 } },
  finish: { ...common, file: "atlas", neon: "#ff2d46", paint: /CARROSSERIE/, color: "#12151b", heading: 0, length: 4.9, shift: 0, dim: true, shot: { pos: [-1.5, 0.42, -5.5], look: [-0.05, 0.62, -1.4], fov: 24 } },
});
const params = new URLSearchParams(location.search);
const key = params.get("car") || "atlas";
const config = { ...CARS[key] };
for (const name of ["heading", "angle", "length", "lift"]) if (params.has(name)) config[name] = Number(params.get(name));
const WIDTH = Number(params.get("w") || 1800), HEIGHT = Number(params.get("h") || 760);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(WIDTH, HEIGHT, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#020304");
scene.fog = new THREE.Fog("#020304", 9, 24);
const camera = new THREE.PerspectiveCamera(26, WIDTH / HEIGHT, 0.1, 80);

// Paint looks real because of what it reflects, so the environment is a dark room with long softboxes.
function studio() {
  const room = new THREE.Scene();
  room.background = new THREE.Color("#030406");
  const panel = (w, h, power, color, x, y, z, rx = 0, ry = 0) => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }));
    mesh.position.set(x, y, z);
    mesh.rotation.set(rx, ry, 0);
    room.add(mesh);
  };
  for (const z of [-1.5, 0, 1.5]) panel(12, 0.35, 26, "#fff4e2", 0, 4.2, z, Math.PI / 2);
  panel(16, 1.1, 5, "#dfe8ff", 0, 1.3, 7.5);
  panel(16, 0.5, 7, "#ffffff", 0, 2.7, -7.5);
  panel(0.4, 3, 9, config.neon, 8, 1.6, 0, 0, Math.PI / 2);
  panel(0.4, 3, 6, config.neon, -8, 1.6, 0, 0, Math.PI / 2);
  const generator = new THREE.PMREMGenerator(renderer);
  const texture = generator.fromScene(room, 0.012).texture;
  generator.dispose();
  return texture;
}
scene.environment = studio();
scene.environmentIntensity = 0.62;

// Wet floor: a real mirror under a dark, slightly rough layer that catches the lights.
const mirror = new Reflector(new THREE.PlaneGeometry(60, 60), { textureWidth: WIDTH, textureHeight: HEIGHT, color: 0x8a8f96, clipBias: 0.001 });
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const noise = document.createElement("canvas");
noise.width = noise.height = 512;
const paintNoise = noise.getContext("2d");
paintNoise.fillStyle = "#808080";
paintNoise.fillRect(0, 0, 512, 512);
let seed = 7;
const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 2600; i++) {
  const shade = 118 + random() * 34;
  paintNoise.fillStyle = `rgba(${shade},${shade},${shade},.5)`;
  paintNoise.beginPath();
  paintNoise.ellipse(random() * 512, random() * 512, 1 + random() * 26, 1 + random() * 9, random() * 3, 0, 7);
  paintNoise.fill();
}
const roughMap = new THREE.CanvasTexture(noise);
roughMap.wrapS = roughMap.wrapT = THREE.RepeatWrapping;
roughMap.repeat.set(26, 26);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: "#030405", roughness: 0.5, metalness: 0.2, roughnessMap: roughMap, transparent: true, opacity: 0.8 }));
floor.material.envMap = scene.environment;
floor.material.envMapIntensity = 0.1;
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.002;
floor.receiveShadow = true;
scene.add(floor);

const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), new THREE.MeshStandardMaterial({ color: "#14171c", roughness: 0.85 }));
wall.position.set(0, 5, -5.6);
scene.add(wall);

// Visible ceiling strips, bright enough to bloom.
const strips = [];
for (const z of [-1.3, 0, 1.3]) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.04, 0.07), new THREE.MeshBasicMaterial({ color: new THREE.Color("#fff1dc").multiplyScalar(7) }));
  strip.position.set(0, 3.55, z);
  scene.add(strip);
  strips.push(strip);
}
const key_light = new THREE.SpotLight("#fff2de", 34, 18, 0.72, 0.9, 1.6);
key_light.position.set(0.4, 5.6, 1.2);
key_light.target.position.set(0, 0, 0);
key_light.castShadow = true;
key_light.shadow.mapSize.set(2048, 2048);
key_light.shadow.bias = -0.0004;
key_light.shadow.radius = 6;
scene.add(key_light, key_light.target);
const wash = new THREE.PointLight(config.neon, 22, 12, 1.8);
wash.position.set(-Math.tan(config.angle) * 5.55 + 0.9, 2.1, -4.9);
scene.add(wash);

// Neon sign on the back wall.
function sign(text, colour) {
  const canvas = document.createElement("canvas");
  canvas.width = 2048;
  canvas.height = 300;
  const ctx = canvas.getContext("2d");
  ctx.font = "700 190px Bahnschrift, 'Arial Narrow', Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  try { ctx.letterSpacing = "26px"; } catch {}
  ctx.lineWidth = 9;
  ctx.strokeStyle = "#fff";
  ctx.strokeText(text, 1024, 150, 1960);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: texture, color: new THREE.Color(colour).multiplyScalar(5), transparent: true, depthWrite: false, fog: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 7.6 * 300 / 2048), material);
  mesh.position.set(-Math.tan(config.angle) * 5.55 + 0.9, 2.5, -5.55);
  if (config.signAt) {
    mesh.position.set(...config.signAt);
    mesh.scale.setScalar(config.signScale);
  }
  scene.add(mesh);
  return material;
}
const neon = sign(config.sign, config.neon);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(WIDTH, HEIGHT, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(WIDTH, HEIGHT), 0.2, 0.6, 0.96));
composer.addPass(new OutputPass());

// The skills scene: a red roller cabinet where every drawer is a skill group, under a wall of hung tools.
function toolScene() {
  const group = new THREE.Group();
  const steel = new THREE.MeshPhysicalMaterial({ color: "#a50f18", metalness: 0.75, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.08 });
  const dark = new THREE.MeshStandardMaterial({ color: "#0b0c0f", metalness: 0.5, roughness: 0.55 });
  const chrome = new THREE.MeshStandardMaterial({ color: "#d9dde3", metalness: 1, roughness: 0.14 });
  const box = (w, h, d, material, x, y, z) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    mesh.position.set(x, y, z);
    group.add(mesh);
    return mesh;
  };
  box(4.6, 2.22, 0.9, steel, 0, 1.33, 0);
  box(4.72, 0.07, 1, dark, 0, 2.48, 0);
  box(4.6, 0.1, 0.92, dark, 0, 0.26, 0);
  for (const [x, z] of [[-2, 0.3], [2, 0.3], [-2, -0.3], [2, -0.3]]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.09, 24), dark);
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(x, 0.11, z);
    group.add(wheel);
  }
  const drawers = [
    ["LANGUAGES AND WEB", "Python  C++  Java  C  JavaScript  HTML  CSS  Node.js"],
    ["DATA AND ML", "TensorFlow  Scikit-Learn  Pandas  NumPy  Matplotlib  Seaborn"],
    ["FRAMEWORKS AND TOOLS", "React  Tailwind  FastAPI  Three.js  SQL  Docker  Git  Vercel"],
    ["FOUNDATIONS", "DSA  DAA  DBMS  OS  MIS  Corporate Finance"],
  ];
  drawers.forEach(([title, skills], i) => {
    const y = 2.14 - i * 0.54;
    box(4.42, 0.49, 0.03, steel, 0, y, 0.46);
    const canvas = document.createElement("canvas");
    canvas.width = 2048;
    canvas.height = 200;
    const paint = canvas.getContext("2d");
    paint.fillStyle = "#0a0b0e";
    paint.fillRect(0, 0, 2048, 200);
    paint.fillStyle = "#ff5a64";
    paint.font = "700 46px Bahnschrift, Arial, sans-serif";
    paint.fillText(title, 44, 74);
    paint.fillStyle = "#f4f1ea";
    paint.font = "400 62px Bahnschrift, Arial, sans-serif";
    paint.fillText(skills, 44, 158, 1960);
    const label = new THREE.CanvasTexture(canvas);
    label.colorSpace = THREE.SRGBColorSpace;
    label.anisotropy = 8;
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(4.1, 0.4), new THREE.MeshStandardMaterial({ map: label, roughness: 0.42, metalness: 0.1, emissive: "#ffffff", emissiveMap: label, emissiveIntensity: 0.34 }));
    plate.position.set(0, y + 0.015, 0.48);
    group.add(plate);
    const handle = new THREE.Mesh(new THREE.CapsuleGeometry(0.014, 4.1, 6, 12), chrome);
    handle.rotation.z = Math.PI / 2;
    handle.position.set(0, y - 0.215, 0.51);
    group.add(handle);
  });
  // Sockets and a torque wrench on top, so the cabinet looks used.
  for (let i = 0; i < 9; i++) {
    const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.055 + i * 0.006, 0.055 + i * 0.006, 0.17, 24), chrome);
    socket.position.set(-2 + i * 0.16, 2.6, 0.08);
    group.add(socket);
  }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 1.25, 16), chrome);
  bar.rotation.z = Math.PI / 2;
  bar.position.set(1.05, 2.54, 0.1);
  group.add(bar);
  return group;
}
function toolWall() {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 64;
  const paint = canvas.getContext("2d");
  paint.fillStyle = "#3b4048";
  paint.fillRect(0, 0, 64, 64);
  paint.fillStyle = "#050608";
  paint.beginPath();
  paint.arc(32, 32, 8, 0, 7);
  paint.fill();
  const map = new THREE.CanvasTexture(canvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(44, 18);
  const board = new THREE.Mesh(new THREE.PlaneGeometry(16, 6.5), new THREE.MeshStandardMaterial({ map, metalness: 0.45, roughness: 0.62 }));
  board.position.set(0, 3.25, -0.72);
  scene.add(board);
  const chrome = new THREE.MeshStandardMaterial({ color: "#d4d8df", metalness: 1, roughness: 0.2 });
  const grip = new THREE.MeshStandardMaterial({ color: "#a50f18", roughness: 0.45 });
  const hang = (mesh, x, y) => {
    mesh.position.set(x, y, -0.66);
    scene.add(mesh);
  };
  // Combination spanners, large to small.
  for (let i = 0; i < 8; i++) {
    const length = 0.86 - i * 0.07;
    const spanner = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.05, length, 0.018), chrome);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.018, 10, 24), chrome);
    ring.position.y = length / 2;
    const jaw = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.018, 10, 24, Math.PI * 1.35), chrome);
    jaw.rotation.z = -Math.PI * 0.18 + Math.PI;
    jaw.position.y = -length / 2 - 0.02;
    spanner.add(shaft, ring, jaw);
    hang(spanner, -3.55 + i * 0.2, 2.95);
  }
  // Screwdrivers.
  for (let i = 0; i < 7; i++) {
    const driver = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.5, 12), chrome);
    blade.position.y = -0.2;
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.032, 0.27, 16), grip);
    handle.position.y = 0.17;
    driver.add(blade, handle);
    hang(driver, 2.15 + i * 0.2, 2.98);
  }
}
const model = config.scene ? toolScene() : (await new GLTFLoader().loadAsync(`../models/${config.file || key}.glb`)).scene;
if (config.scene) toolWall();
const seen = new Set();
model.traverse((node) => {
  if (!node.isMesh) return;
  node.castShadow = true;
  node.receiveShadow = true;
  const list = Array.isArray(node.material) ? node.material : [node.material];
  node.material = list.length === 1 ? upgrade(list[0]) : list.map(upgrade);
});
function upgrade(material) {
  if (seen.has(material.uuid)) return material.userData.upgraded || material;
  seen.add(material.uuid);
  if (!material.isMeshStandardMaterial) return material;
  const glassy = material.transparent || /glass|windshield|window/i.test(material.name);
  const painted = config.paint && config.paint.test(material.name);
  if (!painted && (glassy || material.roughness > 0.5)) return material;
  const next = new THREE.MeshPhysicalMaterial();
  THREE.MeshStandardMaterial.prototype.copy.call(next, material);
  next.clearcoat = 1;
  next.clearcoatRoughness = 0.04;
  if (painted) {
    next.color.set(config.color);
    next.map = null;
    next.metalness = 0.55;
    next.roughness = 0.34;
  }
  material.userData.upgraded = next;
  return next;
}
// Scale to a real length, set it on the floor, and turn the nose the same way for every car.
const holder = new THREE.Group();
holder.add(model);
scene.add(holder);
let box = new THREE.Box3().setFromObject(holder);
let size = box.getSize(new THREE.Vector3());
holder.scale.setScalar(config.length / Math.max(size.x, size.z));
holder.rotation.y = config.heading;
holder.updateMatrixWorld(true);
box = new THREE.Box3().setFromObject(holder);
const centre = box.getCenter(new THREE.Vector3());
holder.position.set(-centre.x, -box.min.y + 0.004 + config.lift, -centre.z);
holder.updateMatrixWorld(true);
size = new THREE.Box3().setFromObject(holder).getSize(new THREE.Vector3());

// Soft contact shadow, which is what plants the tyres on the floor.
const blob = document.createElement("canvas");
blob.width = blob.height = 256;
const blobPaint = blob.getContext("2d");
const fade = blobPaint.createRadialGradient(128, 128, 30, 128, 128, 128);
fade.addColorStop(0, "rgba(0,0,0,.96)");
fade.addColorStop(0.62, "rgba(0,0,0,.82)");
fade.addColorStop(1, "rgba(0,0,0,0)");
blobPaint.fillStyle = fade;
blobPaint.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(size.x * 1.42, size.z * 1.3), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blob), transparent: true, depthWrite: false, fog: false }));
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.006;
scene.add(contact);
if (config.boost) key_light.intensity *= config.boost;
if (config.dim) {
  floor.material.envMapIntensity = 0;
  for (const strip of strips) strip.visible = false;
}
if (config.scene) for (const strip of strips) strip.visible = false;
camera.setViewOffset(WIDTH, HEIGHT, -WIDTH * config.shift, 0, WIDTH, HEIGHT);

window.info = { size: size.toArray().map((n) => +n.toFixed(2)), materials: [...new Set([...seen])].length };
window.renderFrame = (t) => {
  const wave = Math.sin(t * Math.PI * 2);
  const angle = config.angle + wave * 0.045;
  const distance = Math.max(config.length * 1.42, size.y * 3.4);
  if (config.shot) {
    camera.fov = config.shot.fov;
    camera.updateProjectionMatrix();
    camera.position.set(config.shot.pos[0] + wave * 0.07, config.shot.pos[1] + wave * 0.012, config.shot.pos[2]);
    camera.lookAt(...config.shot.look);
  } else {
    camera.position.set(Math.sin(angle) * distance, 0.62 + wave * 0.04, Math.cos(angle) * distance);
    camera.lookAt(0, size.y * 0.42, 0);
  }
  scene.environmentRotation.y = Math.cos(t * Math.PI * 2) * 0.22;
  // Fluorescent tubes and neon, with one quick stutter per loop.
  const stutter = t > 0.62 && t < 0.655 ? 0.25 : 1;
  neon.opacity = stutter;
  wash.intensity = 22 * stutter;
  composer.render();
};
window.saveFrame = async (name, index) => {
  await fetch(`/frame/${name}/${index}`, { method: "POST", body: renderer.domElement.toDataURL("image/png") });
};
window.renderAll = async (name, frames) => {
  for (let i = 0; i < frames; i++) {
    window.renderFrame(i / frames);
    await window.saveFrame(name, i);
    await new Promise((resolve) => setTimeout(resolve, 0));
  }
  return frames;
};
window.renderFrame(0);
window.ready = true;
</script>
